<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MyVault — Personal Digital Vault</title>
  <meta name="description" content="Personal Digital Vault for files, video links, passwords, and notes stored locally with IndexedDB." />
  <meta property="og:title" content="MyVault — Personal Digital Vault" />
  <meta property="og:description" content="Personal Digital Vault for files, video links, passwords, and notes stored locally with IndexedDB." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#080D1A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <style>
    :root {
      --bg-canvas: #080D1A;
      --bg-surface: #0F172A;
      --bg-surface-elevated: #152038;
      --bg-surface-hover: #1B2845;
      --bg-input: #0B1222;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.26);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-blue: #3B82F6;
      --accent-cyan: #06B6D4;
      --accent-purple: #8B5CF6;
      --accent-primary: #3B82F6;
      --accent-secondary: #06B6D4;
      --accent-glow: rgba(59, 130, 246, 0.22);
      --danger: #EF4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
      --success: #10B981;
      --success-soft: rgba(16, 185, 129, 0.12);
      --warning: #F59E0B;
      --warning-soft: rgba(245, 158, 11, 0.12);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sidebar-width: 256px;
      --mobile-header-h: 52px;
      --mobile-nav-h: 60px;
    }

    [data-accent="cyan"] {
      --accent-primary: #06B6D4;
      --accent-secondary: #3B82F6;
      --accent-glow: rgba(6, 182, 212, 0.22);
    }

    [data-accent="purple"] {
      --accent-primary: #8B5CF6;
      --accent-secondary: #06B6D4;
      --accent-glow: rgba(139, 92, 246, 0.24);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100%;
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(59, 130, 246, 0.10), transparent 60%),
        radial-gradient(700px 450px at 95% 0%, rgba(139, 92, 246, 0.08), transparent 55%),
        var(--bg-canvas);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.22);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.38);
    }

    /* App Shell Layout */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Desktop Sidebar */
    .sidebar {
      display: none;
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-subtle);
      padding: 20px 16px;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 30;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px 20px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 6px 18px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9375rem;
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 140ms var(--ease-out);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .nav-item:hover {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.16), rgba(6, 182, 212, 0.08));
      color: #ffffff;
      border: 1px solid rgba(59, 130, 246, 0.28);
    }

    .nav-item.active svg {
      color: var(--accent-cyan);
    }

    .nav-count {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-item.active .nav-count {
      color: var(--accent-cyan);
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .storage-mini {
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
    }

    .storage-mini-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      margin-bottom: 8px;
    }

    .storage-mini-label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .storage-mini-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      font-size: 0.75rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan), var(--accent-purple));
      width: 0%;
      transition: width 320ms var(--ease-out);
    }

    /* Main Column */
    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--mobile-nav-h) + 20px + env(safe-area-inset-bottom, 0px));
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 25;
      height: var(--mobile-header-h);
      background: rgba(8, 13, 26, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .mobile-brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .mobile-brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.0625rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .desktop-page-title {
      display: none;
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .global-search-wrap {
      flex: 1;
      max-width: 420px;
      display: none;
      position: relative;
    }

    .global-search-wrap.open {
      display: block;
      position: absolute;
      left: 12px;
      right: 12px;
      top: 6px;
      max-width: none;
      z-index: 40;
    }

    .search-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      transition: border-color 160ms var(--ease-out);
    }

    .search-input-box:focus-within {
      border-color: var(--accent-cyan);
    }

    .search-input-box svg {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.875rem;
      color: var(--text-primary);
    }

    .search-input-box input::placeholder {
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }

    .icon-btn:hover {
      background: rgba(148, 163, 184, 0.10);
      color: var(--text-primary);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-primary));
      color: #ffffff;
      font-weight: 600;
      font-size: 0.875rem;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: transform 150ms var(--ease-out), opacity 150ms var(--ease-out);
    }

    .btn-primary:hover {
      opacity: 0.94;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.875rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out);
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 10px;
      background: var(--danger-soft);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      font-weight: 600;
      font-size: 0.875rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease-out);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    /* Content Viewport */
    .content-area {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px;
      flex: 1;
    }

    .section-view {
      display: none;
      animation: fadeSlideIn 200ms var(--ease-out);
    }

    .section-view.active {
      display: block;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Section Header */
    .view-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .view-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-wrap: balance;
    }

    .view-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 180ms var(--ease-out), transform 180ms var(--ease-out);
    }

    .kpi-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .kpi-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kpi-icon.blue { background: rgba(59, 130, 246, 0.14); color: #60A5FA; }
    .kpi-icon.cyan { background: rgba(6, 182, 212, 0.14); color: #22D3EE; }
    .kpi-icon.purple { background: rgba(139, 92, 246, 0.14); color: #A78BFA; }
    .kpi-icon.indigo { background: rgba(99, 102, 241, 0.14); color: #818CF8; }

    .kpi-value {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    /* Quick Actions Row */
    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .quick-action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      text-align: left;
      transition: background-color 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 140ms var(--ease-out);
    }

    .quick-action-btn:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .quick-action-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .quick-action-text {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Dashboard 2-column grid */
    .dash-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Storage Breakdown */
    .storage-bars {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .storage-cat-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .storage-cat-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
    }

    .storage-cat-name {
      color: var(--text-secondary);
    }

    .storage-cat-size {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    /* Recent Items List */
    .list-stack {
      display: flex;
      flex-direction: column;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color 140ms var(--ease-out);
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-row-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .item-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }

    .item-title {
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    /* Toolbars & Filters */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .segmented-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }

    .segmented-tabs::-webkit-scrollbar {
      display: none;
    }

    .seg-tab {
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }

    .seg-tab:hover {
      color: var(--text-primary);
    }

    .seg-tab.active {
      background: var(--bg-surface-elevated);
      color: var(--accent-cyan);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .inline-search {
      flex: 1;
      min-width: 180px;
    }

    .select-control {
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 0.875rem;
      outline: none;
    }

    /* Upload Dropzone */
    .dropzone {
      border: 1.5px dashed rgba(59, 130, 246, 0.42);
      background: rgba(15, 23, 42, 0.55);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      margin-bottom: 20px;
      transition: border-color 160ms var(--ease-out), background-color 160ms var(--ease-out);
      cursor: pointer;
    }

    .dropzone.dragover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.10);
    }

    .dropzone-title {
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--text-primary);
    }

    .dropzone-sub {
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    /* File Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .file-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 160ms var(--ease-out), transform 160ms var(--ease-out);
    }

    .file-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .file-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .file-card-preview {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      color: var(--accent-cyan);
      cursor: pointer;
    }

    .file-card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-card-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .action-chip-btn {
      min-height: 36px;
      min-width: 36px;
      padding: 6px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
    }

    .action-chip-btn:hover {
      background: rgba(148, 163, 184, 0.10);
      color: var(--text-primary);
    }

    .action-chip-btn.danger:hover {
      background: var(--danger-soft);
      color: #FCA5A5;
    }

    /* Video Link Cards */
    .video-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 160ms var(--ease-out);
    }

    .video-card:hover {
      border-color: var(--border-strong);
    }

    .video-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-url {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Password Cards */
    .pw-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pw-field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
    }

    .pw-field-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .pw-field-value {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: var(--text-primary);
      word-break: break-all;
    }

    /* Notes Split View */
    .notes-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .notes-list-pane {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 540px;
      overflow-y: auto;
    }

    .note-list-item {
      width: 100%;
      text-align: left;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      transition: background-color 140ms var(--ease-out), border-color 140ms var(--ease-out);
    }

    .note-list-item:hover {
      background: rgba(148, 163, 184, 0.08);
    }

    .note-list-item.active {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.35);
    }

    .notes-editor-pane {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 420px;
    }

    .note-title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 0 10px;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      outline: none;
    }

    .note-body-textarea {
      width: 100%;
      flex: 1;
      min-height: 290px;
      resize: vertical;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.9375rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .note-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    /* Settings */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .setting-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-info-title {
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--text-primary);
    }

    .setting-info-desc {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Empty State */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .empty-state-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .empty-state-desc {
      font-size: 0.875rem;
      max-width: 340px;
    }

    /* Mobile Fixed Bottom Navigation */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      height: calc(var(--mobile-nav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
    }

    .mobile-tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 48px;
      color: var(--text-muted);
      font-size: 0.6875rem;
      font-weight: 500;
      transition: color 150ms var(--ease-out);
    }

    .mobile-tab-btn.active {
      color: var(--accent-cyan);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 160ms var(--ease-out);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-panel {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 200ms var(--ease-out);
    }

    .modal-panel.modal-lg {
      max-width: 820px;
    }

    @keyframes sheetUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.0625rem;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 150ms var(--ease-out);
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent-cyan);
    }

    .form-textarea {
      min-height: 92px;
      resize: vertical;
    }

    .input-with-btn {
      display: flex;
      gap: 8px;
    }

    /* Preview Viewport */
    .preview-container {
      width: 100%;
      min-height: 240px;
      max-height: 62vh;
      background: var(--bg-input);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 8px;
    }

    .preview-container img {
      max-width: 100%;
      max-height: 58vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .preview-container video {
      max-width: 100%;
      max-height: 58vh;
      border-radius: 8px;
    }

    .preview-container iframe {
      width: 100%;
      height: 56vh;
      border: none;
      border-radius: 8px;
      background: #fff;
    }

    .preview-text {
      width: 100%;
      max-height: 56vh;
      overflow: auto;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-primary);
    }

    /* Toast Notifications */
    .toast-region {
      position: fixed;
      bottom: calc(var(--mobile-nav-h) + 16px);
      right: 16px;
      left: 16px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      max-width: 420px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      animation: fadeSlideIn 180ms var(--ease-out);
    }

    .toast.success { border-color: rgba(16, 185, 129, 0.45); }
    .toast.error { border-color: rgba(239, 68, 68, 0.55); }
    .toast.warning { border-color: rgba(245, 158, 11, 0.45); }

    /* Responsive Breakpoints */
    @media (min-width: 640px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .quick-actions-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .toolbar-controls {
        width: auto;
      }
      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }
      .modal-panel {
        border-radius: 20px;
      }
    }

    @media (min-width: 768px) {
      .sidebar {
        display: flex;
      }
      .mobile-bottom-nav,
      .mobile-brand,
      #mobileSearchToggle,
      #mobileSettingsBtn {
        display: none;
      }
      .desktop-page-title {
        display: block;
      }
      .global-search-wrap {
        display: block;
      }
      .top-header {
        height: 64px;
        padding: 0 28px;
      }
      .main-column {
        padding-bottom: 24px;
      }
      .content-area {
        padding: 28px;
      }
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .toast-region {
        bottom: 24px;
        left: auto;
      }
      .notes-layout {
        grid-template-columns: 300px 1fr;
      }
      .settings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .dash-split {
        grid-template-columns: 1.35fr 1fr;
      }
      .cards-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
